# Build from Firestore, deploy to Cloudflare Pages, then ping IndexNow.
#
# Runs:
#  - on every push to main (code or local guide changes)
#  - every day at 13:05 UTC, so scheduled articles go live on their date
#  - when the auto-blog workflow dispatches it
#  - by hand from the Actions tab
#
# Repository secrets needed:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Repository variables:
#   CLOUDFLARE_PAGES_PROJECT                   (the Pages project name)
#   FIREBASE_PROJECT_ID                        (read-only; the service account is NOT used here)
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build (guides come from Firestore)
        run: npm run build
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Every internal link resolves; no guide links to an unpublished one
        run: node scripts/check-links.mjs

      - name: Refuse to ship a noindexed production site
        run: |
          if grep -l 'content="noindex' dist/*.html dist/*/index.html | grep -v '^dist/404.html$'; then
            echo "noindex found on a public page"; exit 1
          fi

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4.142.0 pages deploy dist --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Tell IndexNow what changed in the last 2 days
        run: npm run indexnow -- --since "$(date -u -d '2 days ago' +%F)"
        continue-on-error: true
